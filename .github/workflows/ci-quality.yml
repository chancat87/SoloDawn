# ============================================================================
# CI Workflow: Quality Gate Check
# Branches: main, phase-18-release-readiness
# Triggers: push to branch, pull_request targeting branch
# Required check for: PR to main (quality-gate job)
#                      Release tags (all jobs)
# Jobs: sonar-analysis, quality-gate
# ============================================================================
name: Quality Gate Check

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [ main, phase-18-release-readiness ]
  pull_request:
    branches: [ main, phase-18-release-readiness ]

jobs:
  sonar-analysis:
    name: SonarQube Analysis
    runs-on: ubuntu-latest
    # 45 rather than 30: once CI analysis is switched on this job also runs
    # `cargo clippy` over the whole workspace for the Rust analyzer, and the
    # first run has a cold sccache.
    timeout-minutes: 45

    steps:
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      with:
        fetch-depth: 0 # Full history for better blame/analysis

    # The scan used to run unconditionally with continue-on-error, which hid a
    # total failure: without SONAR_TOKEN the scanner exits 3 ("Not authorized or
    # project not found") on every run, so no CI analysis has ever been uploaded
    # — while the job still reported success. SonarCloud then falls back to
    # Automatic Analysis, which does NOT read sonar-project.properties, so the
    # rule suppressions in that file are silently never applied.
    # Gate on the secret instead: skip loudly when it is missing, fail loudly
    # when it is present and the scan really breaks.
    - name: Check SonarCloud credentials
      id: sonar_creds
      env:
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      run: |
        if [ -z "${SONAR_TOKEN}" ]; then
          echo "configured=false" >> "$GITHUB_OUTPUT"
          echo "::warning title=SonarCloud CI analysis skipped::SONAR_TOKEN is not configured, so sonar-project.properties (including its rule suppressions) is never applied. SonarCloud is running Automatic Analysis instead."
          {
            echo "### SonarCloud CI analysis skipped"
            echo
            echo "\`SONAR_TOKEN\` is not set in this repository's secrets, so the CI scanner cannot"
            echo "authenticate and **\`sonar-project.properties\` is not being applied** — including"
            echo "its \`sonar.issue.ignore.multicriteria\` suppressions. SonarCloud is falling back to"
            echo "Automatic Analysis, which ignores that file by design."
            echo
            echo "To enable CI analysis: create a SonarCloud user token, add it as the \`SONAR_TOKEN\`"
            echo "repository secret, then turn off Automatic Analysis in the SonarCloud project"
            echo "settings (the two modes are mutually exclusive)."
            echo
            echo "Note that Automatic Analysis **cannot analyze Rust at all**, so the bulk of this"
            echo "repository is currently unscanned. Switching to CI analysis is what gets it covered."
          } >> "$GITHUB_STEP_SUMMARY"
        else
          echo "configured=true" >> "$GITHUB_OUTPUT"
        fi

    # Rust is the bulk of this repo, and Sonar's Rust analyzer works by running
    # `cargo clippy` on the analysis machine — so the scanner needs a toolchain
    # or it produces zero Rust findings. (Automatic Analysis cannot analyze Rust
    # at all: the docs list Rust, Objective-C and Dart as unsupported there,
    # which is why every issue SonarCloud has ever raised on this project is
    # docker/typescript/shell.) Gated on the same secret, so this costs nothing
    # until CI analysis is actually switched on.
    - name: Setup Rust environment
      if: steps.sonar_creds.outputs.configured == 'true'
      uses: ./.github/actions/setup-rust
      with:
        components: clippy

    - name: Setup sccache
      if: steps.sonar_creds.outputs.configured == 'true'
      uses: ./.github/actions/setup-sccache

    - name: SonarScan
      if: steps.sonar_creds.outputs.configured == 'true'
      uses: SonarSource/sonarqube-scan-action@299e4b793aaa83bf2aba7c9c14bedbb485688ec4 # v7.1.0
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  quality-gate:
    name: Quality Gate Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

    - name: Setup Rust environment
      uses: ./.github/actions/setup-rust
      with:
        components: ''

    - name: Setup sccache
      uses: ./.github/actions/setup-sccache

    - name: Run quality gate (shadow mode)
      run: bash scripts/quality/run-quality-gate.sh repo ${QUALITY_GATE_MODE:-shadow}
      continue-on-error: ${{ env.QUALITY_GATE_MODE == 'shadow' }}
      env:
        QUALITY_GATE_MODE: shadow

    - name: Show sccache statistics
      if: always()
      run: sccache --show-stats
