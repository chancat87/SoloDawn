# ============================================================================
# Workflow: Sonar Quality Gate (manual)
#
# 切换本项目在 SonarCloud 上使用的质量门禁。**只能手动触发**，不挂任何自动
# 流水线 —— 它改的是 SonarCloud 侧的项目设置，应当每次由人明确发起。
#
#   apply  → 切到「SoloDawn way」：Sonar way 去掉 new_coverage>=80% 那一条，
#            其余五条（安全/可靠性/可维护性评级、重复率、安全热点复核率）原样保留。
#   revert → 切回内置的「Sonar way」。
#
# 为什么需要：本仓库目前不上报任何覆盖率（Rust 侧无覆盖率工具；前端 vitest 配了
# coverage 但未装 @vitest/coverage-v8、也不输出 lcov），new_coverage 恒为 0，
# 门禁恒红，GitHub 上的 SonarCloud check 每次提交都是红叉，每日安全巡检读到的
# github_ci_state 因此永远是 failure。等覆盖率流水线建起来后用 revert 换回，或给
# SoloDawn way 加回 new_coverage 条件。
# ============================================================================
name: Sonar Quality Gate

on:
  workflow_dispatch:
    inputs:
      action:
        description: '切到 SoloDawn way（apply）还是切回内置 Sonar way（revert）'
        required: true
        type: choice
        default: apply
        options:
          - apply
          - revert
          - cleanup

permissions:
  contents: read

jobs:
  switch-gate:
    name: Switch SonarCloud quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

    - name: Switch quality gate
      env:
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      run: node scripts/security/sonar-quality-gate.mjs ${{ inputs.action }}
