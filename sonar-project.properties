sonar.projectKey=huanchong-99_GitCortex
sonar.organization=huanchong-99

sonar.sources=crates,frontend/src,shared
sonar.tests=crates,frontend/src

sonar.inclusions=**/*.rs,**/*.ts,**/*.tsx,**/*.js,**/*.jsx
# .ci/ 下两个文件为 CNB 流水线专用工具链/巡检镜像（非对外交付物），
# 其 docker 告警（S6471 root / S8482 rustup-init）已由安全巡检判定为有意的安全设计；
# 多轮 # NOSONAR 与 issue.ignore.multicriteria 对 Docker 分析器均无效（历史 OPEN issue 不关闭），
# 故精确加入文件级排除（sonar.exclusions），不再对其产生告警；不影响 docker/ 对外镜像的分析。
sonar.exclusions=**/target/**,**/node_modules/**,**/vendor/**,**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/Cargo.toml,.ci/Dockerfile.security-patrol,.ci/Dockerfile.security-verify

sonar.test.inclusions=**/*.test.ts,**/*.test.tsx,**/*_test.rs,**/tests/**

sonar.typescript.lcov.reportPaths=frontend/coverage/lcov.info
sonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info

sonar.sourceEncoding=UTF-8

# Rust workspace uses a single root Cargo.lock — sub-crate Cargo.toml files
# do not need their own lock files. Suppress S8570 false positives.
#
# CNB 流水线专用工具链/巡检镜像（.ci/）的 docker 告警为有意的安全设计，
# 已通过代码与注释说明理由，最小范围精确抑制（仅这两个文件、这两条规则）：
#   - S6471: root 用户（AI Agent / 编译工具链需写 /usr/local 等系统目录）
#   - S8482: rustup-init 为 rust-lang 官方签名安装器，且已改为下载到文件再执行
#
# 注意：sonar.issue.ignore.multicriteria 必须为单一列表（所有条目在同一个 key 下），
# 重复定义会导致 scanner 合并为 e1,e2,e2a... 而 e2 条目已删除，触发
# "Issue exclusions are misconfigured" 使整个抑制失效。
sonar.issue.ignore.multicriteria=e1,e2a,e2b,e2c,e2d
sonar.issue.ignore.multicriteria.e1.ruleKey=text:S8570
sonar.issue.ignore.multicriteria.e1.resourceKey=crates/**/Cargo.toml
sonar.issue.ignore.multicriteria.e2a.ruleKey=docker:S6471
sonar.issue.ignore.multicriteria.e2a.resourceKey=.ci/Dockerfile.security-verify
sonar.issue.ignore.multicriteria.e2b.ruleKey=docker:S6471
sonar.issue.ignore.multicriteria.e2b.resourceKey=.ci/Dockerfile.security-patrol
sonar.issue.ignore.multicriteria.e2c.ruleKey=docker:S8482
sonar.issue.ignore.multicriteria.e2c.resourceKey=.ci/Dockerfile.security-verify
sonar.issue.ignore.multicriteria.e2d.ruleKey=docker:S8482
sonar.issue.ignore.multicriteria.e2d.resourceKey=.ci/Dockerfile.security-patrol
