sonar.projectKey=huanchong-99_GitCortex
sonar.organization=huanchong-99

sonar.sources=crates,frontend/src,shared
sonar.tests=crates,frontend/src

sonar.inclusions=**/*.rs,**/*.ts,**/*.tsx,**/*.js,**/*.jsx
# 注意：这里只排除构建产物与依赖目录。禁止把源文件加进 sonar.exclusions 来消除告警 ——
# 文件级排除会关闭该文件上的「全部」规则，等于永久放弃对它的扫描，属于
# .security/policy.yml → suppression.forbidden 明令禁止的「大范围关闭扫描规则」。
# 确有需要抑制的单条规则，用下方 sonar.issue.ignore.multicriteria 精确到
# 「规则 × 文件」，并在注释中写明理由。
sonar.exclusions=**/target/**,**/node_modules/**,**/vendor/**,**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/Cargo.toml

sonar.test.inclusions=**/*.test.ts,**/*.test.tsx,**/*_test.rs,**/tests/**

sonar.typescript.lcov.reportPaths=frontend/coverage/lcov.info
sonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info

sonar.sourceEncoding=UTF-8

# Rust workspace uses a single root Cargo.lock — sub-crate Cargo.toml files
# do not need their own lock files. Suppress S8570 false positives.
#
# S6471（node 基础镜像默认 root）在 .ci/ 的两个镜像上是最小范围抑制：这两个文件
# 是 CNB 流水线专用的工具链/巡检镜像，不对外交付，构建期必须以 root 写入
# /usr/local/{cargo,rustup,lib/node_modules}。抑制精确到「规则 × 单个文件」，
# 这两个文件上的其余规则一律保持生效。
#
# S8482（执行未校验的下载产物）**不再抑制**：根因已在 .ci/Dockerfile.security-verify
# 中真正修掉（rustup-init 固定版本 + 官方归档 + SHA-256 校验后再执行），
# 抑制条目随根因修复一并移除 —— 否则将来同类问题会被这条抑制默默掩盖。
#
# 注意：sonar.issue.ignore.multicriteria 必须是单一列表（所有条目在同一个 key 下），
# 重复定义会触发 "Issue exclusions are misconfigured" 使整个抑制失效。
#
# 已知局限：SonarCloud 的 Automatic Analysis 不读取本文件，只有 CI 侧的
# scanner（ci-quality.yml 的 SonarQube Analysis）会应用这里的抑制。详见
# .security/README.md「SonarCloud 双分析」一节。
sonar.issue.ignore.multicriteria=e1,e2a,e2b
sonar.issue.ignore.multicriteria.e1.ruleKey=text:S8570
sonar.issue.ignore.multicriteria.e1.resourceKey=crates/**/Cargo.toml
sonar.issue.ignore.multicriteria.e2a.ruleKey=docker:S6471
sonar.issue.ignore.multicriteria.e2a.resourceKey=.ci/Dockerfile.security-verify
sonar.issue.ignore.multicriteria.e2b.ruleKey=docker:S6471
sonar.issue.ignore.multicriteria.e2b.resourceKey=.ci/Dockerfile.security-patrol
